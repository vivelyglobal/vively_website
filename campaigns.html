<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaigns | Vively</title>
  <meta name="description" content="Vively에서 진행 중인 글로벌 크리에이터 캠페인을 확인하고 지원하세요. 뷰티, 다이닝, 여행 등 다양한 카테고리의 브랜드 캠페인이 매주 업데이트됩니다." />
  <link rel="canonical" href="https://www.vivelyglobal.com/campaigns" />
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vively" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="Campaigns | Vively" />
  <meta property="og:description" content="Vively에서 진행 중인 글로벌 크리에이터 캠페인을 확인하고 지원하세요. 뷰티, 다이닝, 여행 등 다양한 카테고리의 브랜드 캠페인이 매주 업데이트됩니다." />
  <meta property="og:url" content="https://www.vivelyglobal.com/campaigns" />
  <meta property="og:image" content="https://www.vivelyglobal.com/assets/logo/vively-logo-black.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="assets/css/style.v13.css" />
  <link rel="stylesheet" href="assets/css/style.work.css" />
  <link rel="stylesheet" href="assets/css/campaigns.css" />
  <link rel="stylesheet" href="assets/css/user-auth.css" />
  <link rel="stylesheet" href="assets/css/style.mobile.v2.css" />
</head>
<body>
  <div id="header-container"></div>

  <main class="campaigns-page">
    <section class="campaign-hero">
      <div class="wrap">
        <div class="campaign-hero-card">
          <div class="campaign-hero-copy">
            <span class="campaign-hero-badge" id="campaign-hero-badge">Live campaigns</span>
            <h1>Your Experience Partner<br />More Than a Platform</h1>
            <p>Build your portfolio, earn rewards, and connect with Seoul's top brands.</p>
            <div class="campaign-hero-actions">
              <a class="btn btn-primary" href="#campaigns-list">Browse campaigns</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="campaign-category-strip" aria-label="Campaign categories">
      <div class="wrap">
        <div class="campaign-category-row" id="campaign-category-row">
          <button type="button" class="campaign-category-chip is-active" data-category-filter="all">
            <span class="campaign-category-media">
              <img src="assets/img/categories/all.webp" alt="All campaign categories" />
            </span>
            <span class="campaign-category-label">All</span>
            <span class="campaign-category-count" data-category-count="all">0</span>
          </button>

          <button type="button" class="campaign-category-chip" data-category-filter="Casting">
            <span class="campaign-category-media">
              <img src="assets/img/categories/casting.webp" alt="Casting category" />
            </span>
            <span class="campaign-category-label">Casting</span>
            <span class="campaign-category-count" data-category-count="Casting">0</span>
          </button>

          <button type="button" class="campaign-category-chip" data-category-filter="Dining">
            <span class="campaign-category-media">
              <img src="assets/img/categories/dining.webp" alt="Dining category" />
            </span>
            <span class="campaign-category-label">Dining</span>
            <span class="campaign-category-count" data-category-count="Dining">0</span>
          </button>

          <button type="button" class="campaign-category-chip" data-category-filter="Beauty & Care">
            <span class="campaign-category-media">
              <img src="assets/img/categories/beauty-care.webp" alt="Beauty and care category" />
            </span>
            <span class="campaign-category-label">Beauty &amp; Care</span>
            <span class="campaign-category-count" data-category-count="Beauty & Care">0</span>
          </button>

          <button type="button" class="campaign-category-chip" data-category-filter="Product">
            <span class="campaign-category-media">
              <img src="assets/img/categories/product.webp" alt="Product category" />
            </span>
            <span class="campaign-category-label">Product</span>
            <span class="campaign-category-count" data-category-count="Product">0</span>
          </button>

          <button type="button" class="campaign-category-chip" data-category-filter="Stay & Travel">
            <span class="campaign-category-media">
              <img src="assets/img/categories/stay-travel.webp" alt="Stay and travel category" />
            </span>
            <span class="campaign-category-label">Stay &amp; Travel</span>
            <span class="campaign-category-count" data-category-count="Stay & Travel">0</span>
          </button>

          <button type="button" class="campaign-category-chip" data-category-filter="Class & Activity">
            <span class="campaign-category-media">
              <img src="assets/img/categories/class-activity.webp" alt="Class and activity category" />
            </span>
            <span class="campaign-category-label">Class &amp; Activity</span>
            <span class="campaign-category-count" data-category-count="Class & Activity">0</span>
          </button>

          <button type="button" class="campaign-category-chip" data-category-filter="Life Service">
            <span class="campaign-category-media">
              <img src="assets/img/categories/life-service.webp" alt="Life service category" />
            </span>
            <span class="campaign-category-label">Life Service</span>
            <span class="campaign-category-count" data-category-count="Life Service">0</span>
          </button>
        </div>
      </div>
    </section>

    <section class="campaign-featured">
      <div class="wrap">
        <div class="campaign-section-head">
          <div>
            <span class="eyebrow">Featured Campaigns</span>
            <h2>Featured Campaigns</h2>
          </div>
          <div class="campaign-section-tools">
            <input type="text" id="search-filter" placeholder="Search campaigns or brands..." />
            <a href="#campaigns-list" class="campaign-section-link">See all →</a>
          </div>
        </div>

        <div id="campaigns-list" class="campaigns-container">
          <!-- Campaigns will be loaded here -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="assets/js/component-loader.js"></script>
  <script src="assets/js/main.js?v=20"></script>
  <script src="assets/js/campaigns.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginButtons = [
        document.getElementById('campaign-login-btn'),
        document.getElementById('campaign-login-btn-2'),
      ];
      const signupButtons = [
        document.getElementById('campaign-signup-btn'),
        document.getElementById('campaign-signup-btn-2'),
      ];

      loginButtons.forEach((button) => {
        if (!button) return;
        button.addEventListener('click', () => {
          if (window.vivelyOpenLoginModal) return window.vivelyOpenLoginModal();
          const fallback = document.getElementById('login-link');
          if (fallback) fallback.click();
        });
      });

      signupButtons.forEach((button) => {
        if (!button) return;
        button.addEventListener('click', () => {
          if (window.vivelyOpenSignupModal) return window.vivelyOpenSignupModal();
          const fallback = document.getElementById('login-link');
          if (fallback) fallback.click();
        });
      });
    });
  </script>
</body>
</html>
