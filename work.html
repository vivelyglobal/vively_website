(function () {

  if (key && !PROJECTS[key]) { location.replace("index.html#work"); return; }

  var p = PROJECTS[key];
  var idx = ORDER.indexOf(key);
  var nextKey = ORDER[(idx + 1) % ORDER.length];
  var next = PROJECTS[nextKey];

  var esc = function (s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  var set = function (id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  };
  var num = function (s) {
    var m = String(s).match(/(\d[\d,]*)/);
    return m ? m[1] : "—";
  };

  set("case-title", p.title);
  set("case-brand", p.brand);
  set("case-num", "Case " + String(idx + 1).padStart(2, "0"));
  set("case-cat", p.cat);
  set("case-service-en", p.serviceEn || p.service);

  set("f-service", p.service);
  set("f-creators", p.creators);
  set("f-reach", p.reach);
  set("f-branches", p.branches);

  /* clips: lazy videos wired up by main.js via data-src + data-autoloop */
