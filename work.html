(function () {
  var key = (location.search.match(/[?&]p=([^&]+)/) || [])[1];
  key = key ? decodeURIComponent(key) : "";
  /* A mistyped key used to fall through to Juno, which made a broken link
     look like a working one. Send unknown keys back to the index instead. */
  if (key && !PROJECTS[key]) { location.replace("index.html#work"); return; }
  var p = PROJECTS[key] || PROJECTS.juno;
  var esc = function (s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  var set = function (id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  };

  document.title = p.brand + " | Vively Work";
  var banner = document.getElementById("proj-banner");
  banner.src = p.banner;
  banner.alt = p.brand + " 캠페인 배너";

  set("proj-cat", p.cat);
  set("proj-title", p.title + " " + p.brand);
  set("proj-overview", p.brand + " 캠페인은 " + p.service + " 방식으로 진행했습니다. 목표는 " + p.goal + "이며, " + p.branches + "에서 실행했습니다.");

  set("f-shares", p.shares);

  set("f-service", p.service);
  set("f-creators", p.creators);
  set("f-reach", p.reach);
  set("f-branches", p.branches);

  /* Clips: .mp4 renders as a hover-to-play video, .gif as a looping image.
     Everything is lazy so a page with four clips isn't a cold-start download. */
  var grid = document.getElementById("clip-grid");
  if (grid) {
    if (!p.clips || !p.clips.length) {
      grid.innerHTML = '<p class="clip-empty">이 캠페인의 콘텐츠는 준비 중입니다.</p>';
    } else {
      grid.innerHTML = p.clips.map(function (src, i) {
        var label = esc(p.brand + " 캠페인 콘텐츠 " + (i + 1));
        if (/\.mp4$/i.test(src)) {
          // data-autoloop: starts playing by itself as the grid comes into
          // view, rather than waiting for a hover
          return '<div class="clip video-card" role="listitem" tabindex="0" aria-label="' + label + '">' +

        }
        return '<div class="clip"><img src="' + esc(src) + '" alt="' + label + '" loading="lazy"></div>';
      }).join("");
      // This runs during parsing, so the clips are in the DOM before main.js
      // fires on DOMContentLoaded and wires up lazy-loading and hover-play.
    }
