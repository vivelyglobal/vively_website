(function () {

  key = key ? decodeURIComponent(key) : "";
  if (key && !PROJECTS[key]) { location.replace("index.html#work"); return; }

  var p = PROJECTS[key];

  var esc = function (s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  var set = function (id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  };
  var num = function (s) {
    var m = String(s).match(/(\d[\d,]*)/);
    return m ? m[1] : "—";
  };

  document.title = p.brand + " | Vively Work";

  /* hero */
  document.getElementById("case-bg").style.backgroundImage = "url('" + p.banner + "')";
  var logo = document.getElementById("case-logo");
  if (p.logo) { logo.src = p.logo; logo.alt = p.brand + " 로고"; logo.hidden = false; }

  set("case-brand", p.brand);
  set("case-num", "Case " + String(idx + 1).padStart(2, "0"));
  set("case-cat", p.cat);
  set("case-service-en", p.serviceEn || p.service);

  /* sections */
  set("t-overview", p.brand + " 캠페인은 " + p.service + " 방식으로 진행했습니다. 목표는 " + p.goal + "이며, " + p.branches + "에서 실행했습니다.");
  var renderStats = function () {
    set("t-approach", p.creators + "이 참여해 각자의 시장을 대상으로 콘텐츠를 제작했고, " + p.reach + "에 도달했습니다.");
    set("t-results", "총 조회수 " + p.views + "회, 공유 " + p.shares + "회를 기록했습니다. 조회수의 대부분이 팔로워가 아닌 신규 유입에서 발생해, 기존 팬덤을 넘어선 도달을 확인했습니다. (Vively 자체 집계, " + (p.source || "2026년 8월 성과 리포트 기준") + ")");
    set("q-overview", p.creators + "의 시선이 " + p.brand + "를 만났습니다.");
    set("q-results", "조회수 " + p.views + "회, 공유 " + p.shares + "회 달성.");
    set("f-creators", p.creators);
  };
  renderStats();
  var insightPlain = p.note.replace(/<[^>]+>/g, "");
  set("t-insight", insightPlain);

  set("q-approach", /\d/.test(p.reach) ? num(p.reach) + "개국에서 전해진 진짜 경험의 콘텐츠." : "현지의 시선으로 전해진 진짜 경험의 콘텐츠.");
  set("q-insight", p.insightQuote || "다음 캠페인으로 이어진 핵심 인사이트.");

  /* facts */
  set("f-brand", p.brand);
  set("f-service", p.service);
  set("f-reach", p.reach);
  set("f-branches", p.branches);
  if (p.reports && p.reports.length) {
    document.getElementById("f-reports").innerHTML = p.reports.map(function (r) {
      return '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.label) + ' &#8599;</a>';
    }).join(" · ");
    document.getElementById("f-reports-row").hidden = false;
  }

  /* live stats: sum views / shares (reposts when shares is empty) / unique creators across sheet tabs */
  if (p.sheet) {
    var parseCsv = function (text) {
      return text.trim().split(/\r?\n/).map(function (line) {
        var out = [], cur = "", q = false;
        for (var i = 0; i < line.length; i++) {
          var ch = line[i];
          if (q) {
            if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
            else if (ch === '"') q = false;
            else cur += ch;
          } else if (ch === '"') q = true;
          else if (ch === ",") { out.push(cur); cur = ""; }
          else cur += ch;
        }
        out.push(cur);
        return out;
      });
    };
    Promise.all(p.sheet.gids.map(function (gid) {
      return fetch("https://docs.google.com/spreadsheets/d/" + p.sheet.id + "/gviz/tq?tqx=out:csv&gid=" + gid)

      texts.forEach(function (text) {
        var rows = parseCsv(text), h = rows.shift() || [];
        var col = function (row, name) { return parseFloat(String(row[h.indexOf(name)] || "").replace(/,/g, "")) || 0; };
        rows.forEach(function (row) {
          if (!row[h.indexOf("deliverable_id")]) return;

          views += col(row, "views");
          shares += col(row, "shares");
          reposts += col(row, "reposts");
        });
      });
      var count = Object.keys(creators).length;
      if (!count) return;

      p.shares = (shares || reposts).toLocaleString("en-US");
      p.creators = p.creators.replace(/\d+명/, count + "명");
      renderStats();
    }).catch(function () {});

        return '<div class="clip" role="listitem">' + idxTag + '<img src="' + esc(src) + '" alt="' + label + '" loading="lazy"></div>';
