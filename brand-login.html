<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Login | Vively</title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <link href="assets/css/style.v13.css" rel="stylesheet" />
  <link href="assets/css/style.mobile.css" rel="stylesheet" />
  <link href="brand-shell.css" rel="stylesheet" />
</head>
<body class="shell-page">
  <div class="shell-layout">
    <aside class="shell-sidebar">
      <div class="shell-brand">
        <img src="assets/logo/vively-logo-white.png" alt="Vively" />
        <div class="shell-brand-text">
          <h2>Brand Portal</h2>
          <p>Company login</p>
        </div>
      </div>

      <nav class="shell-nav" aria-label="Brand Navigation">
        <a class="active" href="brand-login.html">Login</a>
        <a href="brand-signup.html">Sign Up</a>
        <a href="/">Main Website</a>
        <a href="/admin.html">Admin Login</a>
      </nav>
    </aside>

    <main class="shell-main">
      <header class="shell-header">
        <div>
          <h1>Brand Login</h1>
          <div class="shell-subtitle">Manage campaigns, applicants, and approvals</div>
        </div>
        <div class="shell-user">For brand accounts only</div>
      </header>

      <section class="shell-content">
        <div class="shell-auth-card">
          <h2>Sign in</h2>
          <p class="muted">Use your business email and password.</p>

          <div id="brand-login-banner" class="banner"></div>

          <form id="brand-login-form">
            <div class="form-group">
              <label for="brand-login-email">Business Email</label>
              <input type="email" id="brand-login-email" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="brand-login-password">Password</label>
              <input type="password" id="brand-login-password" required autocomplete="current-password" />
            </div>
            <button type="submit" id="brand-login-submit" class="btn btn-accent" style="width:100%;">Login</button>
          </form>

          <div class="shell-auth-link-row">
            <a class="shell-btn secondary" href="brand-signup.html">Create Brand Account</a>
            <a class="shell-btn" href="/">Back to Main Site</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
  (function () {
    const form = document.getElementById('brand-login-form');
    const banner = document.getElementById('brand-login-banner');
    const btn = document.getElementById('brand-login-submit');

    function showBanner(kind, msg) {
      banner.className = 'banner ' + kind;
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      banner.style.display = 'none';
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Logging in...';

      try {
        const email = document.getElementById('brand-login-email').value.trim().toLowerCase();
        const password = document.getElementById('brand-login-password').value;

        const res = await fetch('/.netlify/functions/auth-brand', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          if (data.status === 'pending') {
            showBanner('info', data.error);
          } else {
            showBanner('error', data.error || 'Login failed.');
          }
          return;
        }

        localStorage.setItem('brandToken', data.token);
        localStorage.setItem('brandData', JSON.stringify(data.brand));
        window.location.href = 'brand-dashboard.html';
      } catch (err) {
        console.error('Brand login error:', err);
        showBanner('error', 'Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });
  })();
  </script>
</body>
</html>
