<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Login | Vively</title>
  <meta name="description" content="Vively 브랜드 파트너 로그인 — 캠페인을 관리하고 크리에이터 지원자를 확인하세요." />
  <link rel="canonical" href="https://www.vivelyglobal.com/brand-login" />
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vively" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="Brand Login | Vively" />
  <meta property="og:description" content="Vively 브랜드 파트너 로그인 — 캠페인을 관리하고 크리에이터 지원자를 확인하세요." />
  <meta property="og:url" content="https://www.vivelyglobal.com/brand-login" />
  <meta property="og:image" content="https://www.vivelyglobal.com/assets/logo/vively-logo-black.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link href="assets/css/style.v13.css" rel="stylesheet" />
  <link href="assets/css/style.mobile.v2.css" rel="stylesheet" />
  <link href="brand-shell.css" rel="stylesheet" />
  <style>
    .brand-login-card {
      width: min(100%, 520px);
      padding: clamp(28px, 4vw, 40px);
    }

    .brand-login-card h2 {
      font-size: clamp(30px, 3vw, 40px);
      line-height: 1.05;
    }

    .brand-login-card .muted {
      font-size: 15px;
      line-height: 1.6;
    }

    .brand-login-card .form-group {
      margin-bottom: 16px;
    }

    .brand-login-card label {
      display: block;
      margin-bottom: 7px;
      color: var(--shell-ink);
      font-size: 13px;
      font-weight: 800;
    }

    .brand-login-card input {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid var(--shell-line);
      border-radius: 12px;
      background: #fff;
      color: var(--shell-ink);
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .brand-login-card input:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
    }

    .brand-login-card #brand-login-submit {
      height: 54px;
      margin-top: 4px;
      font-size: 15px;
    }

    .brand-login-card .banner {
      display: none;
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 650;
    }

    .brand-login-card .banner.error {
      background: #f7e9e6;
      color: #7d2d24;
      border: 1px solid #e2c0b9;
    }

    .brand-login-card .banner.info {
      background: #f2f0ec;
      color: #404040;
      border: 1px solid #dcd6ce;
    }

    .brand-login-card .shell-auth-link-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    @media (max-width: 640px) {
      .brand-login-card .shell-auth-link-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="shell-page">
  <div class="shell-layout">
    <aside class="shell-sidebar">
      <div class="shell-brand">
        <img src="assets/logo/vively-logo-white.png" alt="Vively" />
        <div class="shell-brand-text">
          <h2>Brand Portal</h2>
          <p>Company login</p>
        </div>
      </div>

      <nav class="shell-nav" aria-label="Brand Navigation">
        <a class="active" href="brand-login.html">Login</a>
        <a href="brand-signup.html">Sign Up</a>
        <a href="/">Main Website</a>
        <a href="/admin.html">Admin Login</a>
      </nav>
    </aside>

    <main class="shell-main">
      <section class="shell-content">
        <div class="shell-auth-card brand-login-card">
          <h2>Sign in</h2>
          <p class="muted">Use your business email and password.</p>

          <div id="brand-login-banner" class="banner"></div>

          <form id="brand-login-form">
            <div class="form-group">
              <label for="brand-login-email">Business Email</label>
              <input type="email" id="brand-login-email" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="brand-login-password">Password</label>
              <input type="password" id="brand-login-password" required autocomplete="current-password" />
            </div>
            <button type="submit" id="brand-login-submit" class="btn btn-accent" style="width:100%;">Login</button>
          </form>

          <div class="shell-auth-link-row">
            <a class="shell-btn secondary" href="brand-signup.html">Create Brand Account</a>
            <a class="shell-btn" href="/">Back to Main Site</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
  (function () {
    const form = document.getElementById('brand-login-form');
    const banner = document.getElementById('brand-login-banner');
    const btn = document.getElementById('brand-login-submit');

    function showBanner(kind, msg) {
      banner.className = 'banner ' + kind;
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      banner.style.display = 'none';
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Logging in...';

      try {
        const email = document.getElementById('brand-login-email').value.trim().toLowerCase();
        const password = document.getElementById('brand-login-password').value;

        const res = await fetch('/api/auth-brand', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          if (data.status === 'pending') {
            showBanner('info', data.error);
          } else {
            showBanner('error', data.error || 'Login failed.');
          }
          return;
        }

        localStorage.setItem('brandToken', data.token);
        localStorage.setItem('brandData', JSON.stringify(data.brand));
        window.location.href = 'brand-dashboard.html';
      } catch (err) {
        console.error('Brand login error:', err);
        showBanner('error', 'Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });
  })();
  </script>
</body>
</html>
