<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>

<body>
<div id="header-container"></div>
<section class="page-hero" style="padding-bottom:24px;">
<div class="wrap">
<span class="eyebrow">문의하기</span>
<h1>다음 시장을, <span class="hl">함께 검증해보세요.</span></h1>
<p class="lede" style="max-width:560px;margin-top:20px;">브랜드와 목표 시장을 알려주세요. 첫 테스트가 어떤 모습일지 크리에이터, 일정, 예산까지 회신 드리겠습니다.</p>
</div>
</section>
<section class="section" style="border-bottom:none;padding-top:40px;">
<div class="wrap">
<div class="contact-grid">
<div class="reveal">
<div class="contact-card">
<h3 style="font-size:22px;margin-bottom:24px;"><span>프로젝트 시작하기</span></h3>

<div class="tally-fallback">
<p>아래 버튼을 눌러 문의해 주세요. 브랜드와 목표 시장을 알려주시면 첫 테스트 구성안(크리에이터 · 일정 · 예산)을 회신 드립니다.</p>
<a class="btn btn-accent" href="#" id="contact-login-btn">문의하기</a>
</div>
</div>
</div>
<div class="reveal">
<div class="contact-info-item">
<div class="ic"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24"><path d="M3 7l9 6 9-6"></path><rect height="14" rx="2" width="18" x="3" y="5"></rect></svg></div>
<div><h5><span>이메일</span></h5><a href="mailto:vivelyglobal@gmail.com">vivelyglobal@gmail.com</a></div>
</div>
<div class="contact-info-item">
<div class="ic"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg></div>
<div><h5><span>오피스</span></h5><p><span>서울 성수동</span></p></div>
</div>
<div class="contact-info-item">
<div class="ic"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24"><rect height="18" rx="5" width="18" x="3" y="3"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg></div>
<div><h5>Instagram</h5><a href="https://www.instagram.com/vively.global/" rel="noopener" target="_blank">@vively.global</a></div>
</div>
</div>
</div>
</div>
</section>
<div id="footer-container"></div>
<script src="assets/js/component-loader.js"></script>
<script src="assets/js/main.js?v=15"></script>
<script>
	document.addEventListener("DOMContentLoaded", () => {
		const contactLoginBtn = document.getElementById("contact-login-btn");
		if (!contactLoginBtn) return;

		contactLoginBtn.addEventListener("click", (event) => {
			event.preventDefault();

			if (window.vivelyOpenLoginModal) {
				window.vivelyOpenLoginModal();
				return;
			}

			const loginLink = document.getElementById("login-link");
			if (loginLink) {
				loginLink.click();
			}
		});
	});
</script>
</body>
</html>
