<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Vively</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <link href="assets/css/style.v13.css" rel="stylesheet" />
  <link href="brand-shell.css" rel="stylesheet" />
  <style>
    .auth-standalone {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-standalone .shell-auth-card { margin: 0; width: 100%; }
    .auth-standalone .brand-mark { height: 26px; margin-bottom: 22px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 7px; color: var(--shell-ink); }
    .form-group input {
      width: 100%; min-height: 46px; padding: 12px 14px;
      border: 1px solid var(--shell-line); border-radius: 12px; font-size: 14px;
      box-sizing: border-box; outline: none;
    }
    .banner { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 13.5px; display: none; }
    .banner.success { display: block; background: #e8f3ea; color: #1f6b34; border: 1px solid #cfe6d3; }
    .banner.error { display: block; background: #f7e9e6; color: #7d2d24; border: 1px solid #e2c0b9; }
  </style>
</head>
<body class="shell-page">
  <div class="auth-standalone">
    <div class="shell-auth-card">
      <img class="brand-mark" src="assets/logo/vively-logo-black.png" alt="Vively" />
      <h2>Forgot your password?</h2>
      <p class="muted">Enter your email and we'll send you a link to reset it.</p>

      <div id="banner" class="banner"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="fp-email">Email</label>
          <input type="email" id="fp-email" required autocomplete="email" />
        </div>
        <button type="submit" id="fp-submit" class="btn btn-accent" style="width:100%;">Send Reset Link</button>
      </form>

      <div class="shell-auth-link-row">
        <a class="shell-btn" id="back-to-login" href="brand-login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const type = params.get('type') === 'brand' ? 'brand' : 'user';
    const endpoint = type === 'brand' ? '/api/auth-brand' : '/api/auth-login';
    document.getElementById('back-to-login').href = type === 'brand' ? 'brand-login.html' : 'index.html';

    const form = document.getElementById('forgot-form');
    const banner = document.getElementById('banner');
    const submitBtn = document.getElementById('fp-submit');

    function showBanner(kind, msg) {
      banner.className = 'banner ' + kind;
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      banner.style.display = 'none';
      submitBtn.disabled = true;
      const original = submitBtn.textContent;
      submitBtn.textContent = 'Sending…';

      try {
        const email = document.getElementById('fp-email').value.trim().toLowerCase();
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'forgot-password', email }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showBanner('error', data.error || 'Something went wrong. Please try again.');
          return;
        }
        showBanner('success', data.message || "If that email is registered, we've sent a reset link.");
        form.reset();
      } catch (err) {
        showBanner('error', 'Network error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = original;
      }
    });
  })();
  </script>
</body>
</html>
