<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Brands | Vively</title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <link href="assets/css/style.v13.css" rel="stylesheet" />
  <link href="assets/css/style.work.css" rel="stylesheet" />
  <link href="assets/css/style.mobile.css" rel="stylesheet" />
  <style>
    .brand-shell-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #ffffff;
      border-bottom: 1px solid #eceff3;
    }

    .brand-shell-topbar .inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-shell-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #131722;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-shell-nav {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }

    .brand-shell-nav a {
      text-decoration: none;
      font-size: 14px;
      color: #39465a;
      border: 1px solid #dce2ea;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
    }

    .brand-shell-nav a.primary {
      background: #ff5a66;
      border-color: #ff5a66;
      color: #ffffff;
    }

    .brand-entry-wrap {
      min-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: radial-gradient(circle at 20% 20%, #fff6f6 0%, #f8f9fb 45%, #eef1f5 100%);
    }

    .brand-entry-card {
      width: 100%;
      max-width: 700px;
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(20, 24, 34, 0.1);
      padding: 38px 30px;
      text-align: center;
    }

    .brand-entry-card h1 {
      margin: 0 0 10px;
      font-size: 36px;
      line-height: 1.2;
      color: #1c212a;
    }

    .brand-entry-card p {
      margin: 0 auto 26px;
      max-width: 560px;
      color: #5a6473;
      font-size: 15px;
      line-height: 1.6;
    }

    .brand-entry-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .brand-entry-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 10px;
      min-height: 52px;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .brand-entry-actions a:hover {
      transform: translateY(-1px);
    }

    .brand-primary {
      background: #ff5a66;
      color: #fff;
      box-shadow: 0 10px 24px rgba(255, 90, 102, 0.35);
    }

    .brand-secondary {
      border: 1px solid #d8dde7;
      color: #2f3a4c;
      background: #fff;
    }

    .brand-entry-meta {
      margin-top: 16px;
      font-size: 13px;
      color: #7c8796;
    }

    @media (max-width: 700px) {
      .brand-shell-topbar .inner {
        flex-wrap: wrap;
      }

      .brand-entry-card {
        padding: 26px 18px;
      }

      .brand-entry-card h1 {
        font-size: 30px;
      }

      .brand-entry-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="brand-shell-topbar">
    <div class="inner">
      <a class="brand-shell-logo" href="/brand">Vively Brand Portal</a>
      <nav class="brand-shell-nav" aria-label="Brand Portal">
        <a href="brand-login.html">Brand Login</a>
        <a class="primary" href="brand-signup.html">Brand Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="brand-entry-wrap">
    <section class="brand-entry-card">
      <h1>Brand Portal</h1>
      <p>
        Work with Vively to launch creator campaigns globally. Sign up your company account
        first, then our team will review and approve your access.
      </p>

      <div class="brand-entry-actions">
        <a class="brand-primary" href="brand-signup.html">Sign Up as a Brand</a>
        <a class="brand-secondary" href="brand-login.html">Brand Login</a>
      </div>

      <div class="brand-entry-meta">Admin staff login remains at /admin.html</div>
    </section>
  </main>

</body>
</html>
