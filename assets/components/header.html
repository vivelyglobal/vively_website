<!-- Login Modal -->
<div id="login-modal" class="login-modal" style="display:none;">
  <div class="login-modal-content">
    <button class="modal-close" id="modal-close">&times;</button>
    <div class="login-form-container">
      <h2>Login to Vively</h2>
      
      <form id="user-login-form" class="auth-form">
        <div class="form-group">
          <label for="user-email">Email</label>
          <input type="email" id="user-email" required />
        </div>
        <div class="form-group">
          <label for="user-password">Password</label>
          <input type="password" id="user-password" required />
        </div>
        <button type="submit" class="btn btn-accent" style="width: 100%;">Login</button>
      </form>

      <div class="divider">OR</div>

      <button id="google-login-btn" class="btn btn-ghost" style="width: 100%; gap: 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
        </svg>
        Continue with Google
      </button>

      <p class="form-footer">Don't have an account? <a href="#" id="signup-toggle">Sign up</a></p>
    </div>

    <div class="signup-form-container" style="display:none;">
      <h2>Create Account</h2>
      
      <form id="user-signup-form" class="auth-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required />
        </div>
        <button type="submit" class="btn btn-accent" style="width: 100%;">Sign Up</button>
      </form>

      <p class="form-footer">Already have an account? <a href="#" id="login-toggle">Login</a></p>
    </div>
  </div>
</div>
