[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "."

[dev]
  functions = "netlify/functions"
  port = 8888
  framework = "#static"
  targetPort = 8888

[[redirects]]
  from = "/brand"
  to = "/brand-login.html"
  status = 200
  force = true

[[redirects]]
  from = "/brand/"
  to = "/brand-login.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Production context uses the same no-op build as dev (this is a static site).
# If a real build pipeline is added later, change command here.
[context.production]
  command = "npm run build"
