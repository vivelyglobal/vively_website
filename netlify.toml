[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "."

[dev]
  functions = "netlify/functions"
  port = 8888
  framework = "#static"
  targetPort = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[context.production]
  command = "npm run build:prod"
